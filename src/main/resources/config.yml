# ============================================================================
#  TabCompleteFilter — TRUE-OG config (built from live LuckPerms export)
# ----------------------------------------------------------------------------
#  HOW IT WORKS:
#   - WHITELIST. PlayerCommandSendEvent clears all tab commands, then re-adds
#     only those listed for the tcf groups the player has.
#   - A group "x" applies to a player who has permission  tcf.x
#   - !! No tcf.<group> perm = ZERO tab completions. Everyone needs tcf.default.
#   - Groups STACK. We exploit LuckPerms RANK INHERITANCE: attach one tcf node
#     at each rank group; higher ranks inherit the lower tcf.* nodes, so each
#     command is listed ONCE at the tier that first grants its permission.
#   - Visibility only. Players still need the command's own perm to run it.
#     These lists were pruned to the perms each rank actually has.
#   - WorldEdit "//" commands: written with two slashes; plugin strips one.
#
#  Your rank chain (each inherits the previous):
#   default -> og -> og-pro -> og-master -> tester -> youtube
#           -> helper -> builder -> moderator -> admin
#
#  LUCKPERMS SETUP (run once; inheritance handles the rest):
#     /lp group default   permission set tcf.default   true
#     /lp group og        permission set tcf.og        true
#     /lp group og-pro    permission set tcf.ogpro     true
#     /lp group og-master permission set tcf.ogmaster  true
#     /lp group helper    permission set tcf.helper    true
#     /lp group builder   permission set tcf.builder   true
#     /lp group moderator permission set tcf.moderator true
#     /lp group admin     permission set tcf.bypass    true   # admin sees ALL
#
#  NOTE: tester/youtube grant no NEW root commands (cosmetic/subcommand
#  perms only), so they get no tcf group — they inherit the tiers below.
# ============================================================================

# Admins use tcf.bypass (above). Leave OP bypass on as a safety net.
op-player-filter-bypass: true

groups:

  # --------------------------------------------------------------------------
  # default — every player (group.default). Baseline from default-rank perms.
  # --------------------------------------------------------------------------
