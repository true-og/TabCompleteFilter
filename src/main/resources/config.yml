    - /find            # quickshop.find + finditem.use
    # bounties
    - /bounty          # bountyhunters.*
    # minigames (own perms, default-true — not in LP export)
    - /duel            # duels.queue/stats/toggle
    - /spectate        # duels.spectate
    - /queue           # duels.queue
    - /splegg
    - /spleef
    - /buildbattle
    - /battlearena
    - /hub
    - /plugins
