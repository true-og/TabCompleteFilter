    - /topplaytime     # pt.top
    - /uptime          # pt.uptime
    - /togglephantoms  # utilities.togglephantoms
    - /togglescoreboard
    - /cleanupin       # nodespawnog.cleanupin
    # communication
    - /msg             # essentials.msg
    - /r               # essentials.r
    - /mail            # essentials.mail
    - /ignore          # essentials.ignore
    # teleport / homes
    - /spawn           # essentials.spawn
    - /home            # essentials.home
    - /sethome         # essentials.sethome(.multiple)
    - /delhome         # essentials.delhome
    - /tpa             # essentials.tpa
    - /tpaccept        # essentials.tpaccept
    - /tpdeny          # essentials.tpdeny
    - /tpacancel       # essentials.tpacancel
    - /suicide         # essentials.suicide
    # economy (DiamondBank)
    - /balance         # diamondbank-og.balance
    - /baltop          # diamondbank-og.balancetop
    - /pay             # diamondbank-og.pay
    - /deposit         # diamondbank-og.deposit
    - /withdraw        # diamondbank-og.withdraw
